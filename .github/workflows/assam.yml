name: Fetch CWC Assam Water Levels

on:
  schedule:
    # Every 3 hours (UTC). Change as needed.
    - cron: "0 */3 * * *"
  workflow_dispatch:          # Manual "Run workflow" button

permissions:
  contents: write             # Needed to push the JSON back into the repo

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch CWC Assam data
        run: python scripts/fetch_cwc_assam.py

      - name: Commit & push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cwc_assam_water_levels.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update CWC Assam water levels $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
