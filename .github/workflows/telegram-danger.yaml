name: Telegram River Updates

on:
  schedule:
    # Every 2 hours at minute 55 (UTC)
    - cron: "56 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch levels and post to Telegram group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_danger_bot.py

      - name: Save danger state
        run: |
          git config user.name "flood-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p bot_state
          git add bot_state/danger_state.json || true
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "bot: update danger state"
            git push
          fi
