name: Telegram test post

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is empty"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is empty"
            exit 1
          fi
          echo "Chat id length: ${#TELEGRAM_CHAT_ID}"
          echo "Token length: ${#TELEGRAM_BOT_TOKEN}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=GitHub Actions test: bot can post in this group." \
            -o /tmp/tg.json -w "HTTP %{http_code}\n"
          echo "Response:"
          cat /tmp/tg.json
          echo
          grep -q '"ok":true' /tmp/tg.json || grep -q '"ok": true' /tmp/tg.json
