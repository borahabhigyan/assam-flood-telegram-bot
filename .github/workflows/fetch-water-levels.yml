name: Fetch Water Level Data

on:
  schedule:
    # Every 3 hours – change as needed
    - cron: "0 */1 * * *"
  workflow_dispatch:          # manual run button

permissions:
  contents: write             # needed to push the JSON back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & save data
        run: python scripts/fetch_water_levels.py

      - name: Commit & push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/water_level_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update water level data $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
